# Reverse proxy nginx pour OGS Online (HTTP + WebSocket sur /ws). __DOMAIN__ est remplacé par setup-vps.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Temps réel : pas de mise en tampon des messages WebSocket, envoi immédiat.
        proxy_buffering off;
        tcp_nodelay on;
    }

    # Le code du jeu ne doit jamais être mis en cache (sinon un navigateur garde une vieille version après une mise à jour).
    location ~* \.(js|css|html)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Les images/icônes peuvent être gardées.
    location ~* \.(png|ico|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
